<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV & Wind Karte – MaStR Deutschland</title>
<!-- Leaflet + MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
#map { height:100%; width:100%; }

/* Info-Bar oben (Mitte) */
#infobar {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  z-index:1000; background:#fff; padding:6px 16px; border-radius:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:13px; color:#333;
  white-space:nowrap; pointer-events:none;
}

/* Top-Bar oben rechts (Suchbereich, ~20% der Karte einnehmend) */
#topbar {
  position:absolute; top:10px; right:10px;
  width:320px; max-width:calc(100vw - 30px);
  z-index:1000;
}
#topbar-inner {
  background:#fff; border-radius:10px;
  box-shadow:0 3px 14px rgba(0,0,0,.18);
  padding:10px 12px;
}
#search-wrapper { position:relative; }
#search-input {
  font-size:14px; padding:9px 34px 9px 12px; border:1px solid #ccc; border-radius:8px;
  width:100%; box-sizing:border-box;
}
#search-input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
#search-clear {
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border:none; background:#e5e7eb; color:#4b5563;
  border-radius:6px; font-size:13px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#search-clear:hover { background:#fca5a5; color:#991b1b; }
#search-suggest {
  position:absolute; top:100%; left:0; right:0; z-index:2000;
  background:#fff; border:1px solid #ccc; border-top:none; border-radius:0 0 8px 8px;
  max-height:340px; overflow-y:auto; display:none;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}
#search-suggest.open { display:block; }
#search-suggest .sug-item {
  padding:9px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  font-size:13px;
}
#search-suggest .sug-item:last-child { border-bottom:none; border-radius:0 0 8px 8px; }
#search-suggest .sug-item:hover, #search-suggest .sug-item.active { background:#dbeafe; }
#search-suggest .sug-item b { color:#2563eb; }
#search-suggest .sug-item .sug-meta { color:#888; font-size:11px; white-space:nowrap; }
#topbar-hits {
  font-size:11px; color:#888; margin-top:4px; padding:0 2px;
}

/* Statistik-Button in Top-Bar */
#topbar-actions { margin-top:6px; display:flex; justify-content:flex-end; }
#btn-stats {
  font-size:13px; padding:6px 14px; border:1px solid #2563eb; background:#2563eb;
  color:#fff; border-radius:8px; cursor:pointer; font-weight:600;
}
#btn-stats:hover { background:#1d4ed8; }

/* Overlay */
#stats-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:1500;
  display:none; opacity:0; transition:opacity .2s;
}
#stats-overlay.open { display:block; opacity:1; }

/* Sidebar */
#stats-panel {
  position:fixed; top:0; right:-460px; width:440px; max-width:94vw; height:100%;
  background:#fff; z-index:1600; box-shadow:-4px 0 24px rgba(0,0,0,.3);
  display:flex; flex-direction:column;
  transition:right .25s ease; border-radius:12px 0 0 12px;
}
#stats-panel.open { right:0; }
#stats-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 18px; border-bottom:1px solid #eee;
}
#stats-header h2 { font-size:18px; margin:0; }
#stats-close {
  width:30px; height:30px; border:none; background:#e5e7eb; color:#4b5563;
  border-radius:8px; font-size:15px; cursor:pointer;
}
#stats-close:hover { background:#fca5a5; color:#991b1b; }

/* Tabs */
#stats-tabs { display:flex; gap:4px; padding:10px 18px 0; border-bottom:1px solid #eee; }
#stats-tabs .tab {
  flex:1; padding:9px; border:1px solid #ddd; border-bottom:none; border-radius:8px 8px 0 0;
  background:#f5f5f5; color:#555; font-size:13px; font-weight:600; cursor:pointer;
}
#stats-tabs .tab.active { background:#fff; color:#2563eb; border-color:#e0e0e0; }

/* Panel-Inhalt scrollbar */
#stats-body { flex:1; overflow-y:auto; padding-bottom:20px; }
.stats-tab { display:none; padding:14px 18px; }
.stats-tab.active { display:block; }

/* Controls + Betreiber-Tabelle */
.stats-controls { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.stats-controls select, .stats-controls input {
  font-size:13px; padding:5px 8px; border:1px solid #ccc; border-radius:6px;
}
.stats-controls input { flex:1; min-width:120px; }
#stats-table { width:100%; border-collapse:collapse; font-size:13px; }
#stats-table th, #stats-table td { padding:7px 8px; border-bottom:1px solid #eee; text-align:left; }
#stats-table th { background:#f7f9fc; color:#333; cursor:pointer; user-select:none; }
#stats-table th.num, #stats-table td.num { text-align:right; white-space:nowrap; }
#stats-table th.sorted-asc::after { content:" ▲"; color:#2563eb; font-size:10px; }
#stats-table th.sorted-desc::after { content:" ▼"; color:#2563eb; font-size:10px; }
#stats-table tbody tr { cursor:pointer; }
#stats-table tbody tr:hover { background:#eef3ff; }
#stats-table td.name { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#stats-count { margin-top:8px; font-size:12px; color:#888; }

/* Größenklassen-Balken (professionell mit Achsen) */
#groesse-header {
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  flex-wrap:wrap; margin-bottom:8px;
}
#groesse-toggle { display:flex; gap:4px; }
#groesse-toggle .gbtn, #groesse-measure .mbtn {
  padding:6px 14px; border:1px solid #ddd; border-radius:8px; background:#f5f5f5;
  color:#555; font-size:13px; font-weight:600; cursor:pointer;
}
#groesse-toggle .gbtn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
#groesse-toggle .gbtn[data-tech="pv"].active { background:#d97706; border-color:#d97706; }
#groesse-measure { display:flex; gap:4px; }
#groesse-measure .mbtn.active { background:#111827; color:#fff; border-color:#111827; }

#groesse-summary {
  background:#f7f9fc; border:1px solid #e5e7eb; border-radius:8px;
  padding:8px 12px; margin-bottom:12px; font-size:13px; color:#374151;
  display:flex; gap:20px; flex-wrap:wrap; line-height:1.5;
}
#groesse-summary b { color:#111827; }

/* Chart-Achsen-Layout */
.chart-wrap { display:flex; gap:8px; align-items:stretch; }
.chart-y { display:flex; flex-direction:column; width:66px; flex-shrink:0; }
.chart-grid { flex:1; position:relative; }
.chart-grid::before {
  content:''; position:absolute; left:0; right:0; top:0; bottom:0;
  background-image:linear-gradient(to bottom, #eef2f7 1px, transparent 1px);
  background-size:100% 60px; opacity:.5; pointer-events:none;
}
.chart-y .y-ticks { font-size:11px; color:#9ca3af; line-height:1; padding:0 6px 0 0; text-align:right; }
.chart-y .y-ticks.t0 { height:20px; display:flex; align-items:flex-start; justify-content:flex-end; }
.chart-y .y-ticks.t50 { height:40px; display:flex; align-items:flex-start; justify-content:flex-end; padding-top:2px; }
.chart-y .y-ticks.t100 { flex:1; display:flex; align-items:flex-end; justify-content:flex-end; padding-bottom:18px; }

/* Eine Zelle je Klasse: Balkenzeile + Label darunter */
.bar-cell { position:relative; }
.bar-cell:not(:last-child) { margin-bottom:6px; }
.bar-cell .bar-label {
  font-size:12px; color:#374151; text-align:left; padding-left:2px; margin-top:1px;
}
.bar-cell .bar-label .bar-klasse { font-weight:600; }
.bar-cell .bar-label small { color:#9ca3af; }
.bar-row {
  display:flex; align-items:center; width:100%; position:relative; height:22px;
}
.bar-track {
  flex:1; height:18px; background:#f3f4f6; border-radius:4px;
  position:relative; overflow:visible;
}
.bar-fill {
  height:100%; border-radius:4px 0 0 4px; min-width:6px;
  display:flex; align-items:center; justify-content:flex-end;
  position:relative; transition:width .2s ease;
}
.bar-fill.wind { background:linear-gradient(90deg,#1d4ed8,#3b82f6); }
.bar-fill.pv   { background:linear-gradient(90deg,#b45309,#f59e0b); }
/* Primärwert rechtsbündig in fester Spalte, immer sichtbar & sauber ausgerichtet */
.bar-value {
  min-width:96px; text-align:right; margin-left:8px; flex-shrink:0;
  font-size:13px; font-weight:700; color:#111827; white-space:nowrap;
}
.bar-sublabel {
  color:#9ca3af; font-weight:400; margin-left:8px; font-size:11px;
}
.bar-row:hover .bar-track { outline:2px solid #93c5fd; outline-offset:1px; }
.bar-row:hover { cursor:pointer; }

#groesse-legend {
  margin-top:10px; font-size:11px; color:#9ca3af; border-top:1px solid #eee;
  padding-top:8px;
}
.bar-tip {
  position:fixed; background:#111827; color:#f9fafb; padding:8px 12px; border-radius:8px;
  font-size:12px; line-height:1.6; pointer-events:none; z-index:3000; display:none;
  max-width:300px; box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.bar-tip b { color:#fff; display:block; margin-bottom:2px; }
.bar-tip .tip-row { display:flex; justify-content:space-between; gap:16px; }
.bar-tip .tip-row span:first-child { color:#9ca3af; }
.bar-tip .tip-row span:last-child { text-align:right; font-weight:600; }
.bar-tip .tip-note { margin-top:4px; padding-top:4px; border-top:1px solid #374151; color:#9ca3af; font-size:11px; }

/* Feste Urheber-Info unten links (wie Leaflet-Attribution) */
#filter-attribution {
  position:absolute; bottom:4px; left:10px; z-index:1000;
  font-size:11px; color:rgba(0,0,0,.55); pointer-events:none;
  text-shadow:0 1px 1px rgba(255,255,255,.8);
}

/* Filter unten links (kompakt) */
#toolbar {
  position:absolute; bottom:30px; left:10px; z-index:1000;
  background:#fff; padding:6px 10px; border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:13px;
  display:flex; gap:6px; align-items:center; flex-wrap:wrap;
}
#toolbar label { color:#555; font-size:11px; }
#toolbar select { font-size:12px; padding:2px 5px; border:1px solid #ccc; border-radius:4px; }

/* Legende unten rechts */
#legend {
  position:absolute; bottom:30px; right:10px; z-index:1000;
  background:#fff; padding:10px 14px; border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:13px; line-height:1.8;
  min-width:140px;
}
#legend .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.dot-wind { background:#2563eb; }
.dot-pv   { background:#d97706; }
#legend small { display:block; color:#888; font-size:11px; margin-top:4px; }

/* Popup */
.leaflet-popup-content { font-size:13px; line-height:1.5; max-height:350px; overflow-y:auto; }
.leaflet-popup-content h3 { font-size:14px; margin-bottom:4px; }
.leaflet-popup-content table { width:100%; border-collapse:collapse; }
.leaflet-popup-content td { padding:2px 4px; border-bottom:1px solid #eee; }
.leaflet-popup-content td:first-child { color:#888; width:40%; }

@media (max-width:600px) {
  #infobar { font-size:11px; padding:4px 10px; top:64px; }
  #legend { font-size:11px; padding:6px 10px; min-width:100px; bottom:70px; }
  #toolbar { font-size:11px; padding:4px 8px; flex-wrap:wrap; }
  #topbar { top:8px; right:8px; width:calc(100vw - 16px); max-width:none; }
  #topbar-inner { padding:8px 10px; }
  #search-input { font-size:14px; padding:8px 10px; }
  #search-suggest { max-height:280px; }
}
</style>
</head>
<body>
<div id="map"></div>
<div id="infobar">Lade Daten…</div>

<!-- Obere Leiste oben rechts: Suche (prominent) -->
<div id="topbar">
  <div id="topbar-inner">
    <div id="search-wrapper">
      <input type="text" id="search-input" placeholder="Suche Anlage… z.B. Döllen" autocomplete="off">
      <button type="button" id="search-clear" title="Suche löschen" style="display:none">✕</button>
      <div id="search-suggest"></div>
    </div>
    <div id="topbar-hits" style="display:none">0 Treffer · <span id="topbar-result"></span></div>
    <div id="topbar-actions">
      <button type="button" id="btn-stats" title="Statistik öffnen">📊 Statistik</button>
    </div>
  </div>
</div>

<!-- Statistik-Sidebar (Overlay) -->
<div id="stats-overlay"></div>
<aside id="stats-panel">
  <header id="stats-header">
    <h2>Statistik</h2>
    <button type="button" id="stats-close" title="Schließen">✕</button>
  </header>
  <div id="stats-body">

    <!-- Tabs -->
    <div id="stats-tabs">
      <button class="tab active" data-tab="betreiber">Betreiber</button>
      <button class="tab" data-tab="groesse">Größenklassen</button>
    </div>

    <!-- Betreiber-Ansicht -->
    <section id="tab-betreiber" class="stats-tab active">
      <div class="stats-controls">
        <select id="stats-tech">
          <option value="">Alle</option>
          <option value="wind">Wind</option>
          <option value="pv">PV</option>
        </select>
        <select id="stats-top">
          <option value="10">Top 10</option>
          <option value="50" selected>Top 50</option>
          <option value="100">Top 100</option>
          <option value="all">Alle</option>
        </select>
        <input type="text" id="stats-filter" placeholder="Betreiber filtern…">
      </div>
      <table id="stats-table">
        <thead>
          <tr>
            <th data-key="name">Betreiber</th>
            <th data-key="anzahl" class="num">Anzahl</th>
            <th data-key="sum_mw" class="num">Summe MW</th>
            <th data-key="avg_mw" class="num">Ø MW</th>
          </tr>
        </thead>
        <tbody id="stats-tbody"></tbody>
      </table>
      <div id="stats-count"></div>
    </section>

    <!-- Größenklassen-Ansicht -->
    <section id="tab-groesse" class="stats-tab">
      <div id="groesse-header">
        <div id="groesse-toggle">
          <button class="gbtn active" data-tech="wind">Wind</button>
          <button class="gbtn" data-tech="pv">PV</button>
        </div>
        <div id="groesse-measure">
          <button class="mbtn active" data-measure="anzahl">Anlagen</button>
          <button class="mbtn" data-measure="leistung">Leistung (MW)</button>
        </div>
      </div>
      <div id="groesse-summary"></div>
      <div id="groesse-chart"></div>
      <div id="groesse-legend">
        <span>Balken = Anzahl Anlagen je Größenklasse</span>
      </div>
    </section>

  </div>
</aside>

<!-- Filter unten links -->
<div id="toolbar">
  <label>Typ</label>
  <select id="filter-type"><option value="">Alle</option><option value="wind">Wind</option><option value="pv">PV</option></select>
  <label>Bundesland</label>
  <select id="filter-bl"><option value="">Alle</option></select>
</div>

<div id="legend">
  <span class="dot dot-wind"></span> Wind (≥1 MW)<br>
  <span class="dot dot-pv"></span> PV (≥1 MWp)<br>
  <small id="data-stand">–</small>
</div>
<div id="filter-attribution">PiBrain by fabibuss@web.de</div>
<div id="bar-tip" class="bar-tip"></div>

<script>
let map, allUnits = [], markers = {};
let clusterGroup, currentLayer;

async function init() {
  map = L.map('map', { zoomControl: true }).setView([51.5, 10.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 18,
  }).addTo(map);

  clusterGroup = L.markerClusterGroup({
    chunkedLoading: true,
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    disableClusteringAtZoom: 17,
  });
  map.addLayer(clusterGroup);
  currentLayer = clusterGroup;

  // Daten laden (eingebettet oder per HTTP)
  try {
    let einheiten, meta, statistiken = null;
    if (window.__PVWIND_DATA__ && window.__PVWIND_META__) {
      einheiten = window.__PVWIND_DATA__;
      meta = window.__PVWIND_META__;
      statistiken = window.__PVWIND_STATS__ || null;
    } else {
      [einheiten, meta, statistiken] = await Promise.all([
        fetch('assets/einheiten.json').then(r => r.json()),
        fetch('assets/meta.json').then(r => r.json()),
        fetch('assets/statistiken.json').then(r => r.json()).catch(() => null)
      ]);
    }
    allUnits = einheiten;
    window.__STATS__ = statistiken;  // für Statistik-Panel
    document.getElementById('data-stand').textContent = 'Stand: ' + (meta.stand || '?');
    const windCount = meta.counts?.Wind || 0;
    const pvCount = meta.counts['Solare Strahlungsenergie'] || 0;
    document.getElementById('infobar').textContent =
      `PV & Wind Karte – ${windCount} Wind · ${pvCount} PV`;
    populateFilterBl();
    renderMarkers(einheiten);
    initStats();
  } catch(e) {
    document.getElementById('infobar').textContent = 'Fehler beim Laden: ' + e.message;
  }

  // Filter-Listener
  document.getElementById('filter-type').addEventListener('change', applyFilters);
  document.getElementById('filter-bl').addEventListener('change', applyFilters);

  // Suche
  document.getElementById('search-input').addEventListener('input', onSearchInput);
  document.getElementById('search-input').addEventListener('keydown', onSearchKeydown);
  document.getElementById('search-clear').addEventListener('click', clearSearch);
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#search-wrapper')) closeSuggest();
  });
}

// Suchfeld leeren -> alle Anlagen wieder anzeigen
function clearSearch() {
  document.getElementById('search-input').value = '';
  closeSuggest();
  document.getElementById('search-clear').style.display = 'none';
  applyFilters();
  document.getElementById('search-input').focus();
}

function populateFilterBl() {
  const blSet = new Set();
  allUnits.forEach(u => { if(u.b) blSet.add(u.b); });
  const sel = document.getElementById('filter-bl');
  [...blSet].sort().forEach(b => {
    const o = document.createElement('option');
    o.value = b; o.textContent = b; sel.appendChild(o);
  });
}

function renderMarkers(units) {
  clusterGroup.clearLayers();
  const markers = units.map(u => {
    const icon = L.divIcon({
      html: `<div style="width:10px;height:10px;border-radius:50%;background:${u.t==='wind'?'#2563eb':'#d97706'};border:1px solid #fff;"></div>`,
      iconSize: [12,12],
      className: '',
    });
    const m = L.marker([u.lat, u.lon], { icon });
    m.bindPopup(buildPopup(u));
    return m;
  });
  clusterGroup.addLayers(markers);
}

function applyFilters() {
  const type = document.getElementById('filter-type').value;
  const bl   = document.getElementById('filter-bl').value;
  let filtered = allUnits;
  if (type) filtered = filtered.filter(u => u.t === type);
  if (bl)   filtered = filtered.filter(u => u.b === bl);
  renderMarkers(filtered);
}

/* ---------- Suche mit Autocomplete ---------- */
// Normalisierung: Groß-/Kleinschreibung + Umlaute ignorieren
function norm(s) {
  return (s || '').toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u')
    .replace(/ß/g,'ss').replace(/é|è|ê/g,'e').replace(/à|â/g,'a')
    .replace(/ç/g,'c').trim();
}

let _suggestCache = null;
function searchIndex() {
  // einmalig alle durchsuchbaren Strings je Anlage bauen
  if (_suggestCache) return _suggestCache;
  _suggestCache = allUnits.map(u => {
    const park = u.park || u.wp || '';
    return {
      u,
      hay: norm([u.n, park, u.g].join(' ')),
      matches: [] // gefüllte Match-Stellen (offsetSets)
    };
  });
  return _suggestCache;
}

// Fuzzy-Prefix/contains-Matching: Suche "döll" findet alles, wo n/park/g "döll" enthält
function searchUnits(q) {
  const nq = norm(q);
  if (nq.length < 2) return [];
  const hits = [];
  for (const it of searchIndex()) {
    const idx = it.hay.indexOf(nq);
    if (idx !== -1) hits.push({ u: it.u, idx });
  }
  // 1. Einträge, deren NAME mit dem Suchstring beginnt, zuerst
  hits.sort((a,b) => {
    const an = norm(a.u.n).startsWith(nq) ? 0 : 1;
    const bn = norm(b.u.n).startsWith(nq) ? 0 : 1;
    if (an !== bn) return an - bn;
    return a.idx - b.idx;
  });
  return hits;
}

function highlightName(name, q) {
  const nq = norm(q);
  if (!nq) return esc(name);
  // Finde Startposition des normierten Musters im Original
  let j = 0, k = 0, start = -1;
  const nl = norm(name);
  while (j < name.length && k < nq.length) {
    if (nl[j] === nq[k]) { if (k===0) start=j; k++; }
    else if (k>0) break;
    j++;
  }
  if (start === -1) return esc(name);
  const end = start + nq.length;
  return esc(name.slice(0,start)) + '<b>' + esc(name.slice(start,end)) + '</b>' + esc(name.slice(end));
}

function showSuggest(hits) {
  const box = document.getElementById('search-suggest');
  const hitsEl = document.getElementById('topbar-hits');
  const resultEl = document.getElementById('topbar-result');
  if (!hits.length) {
    box.classList.remove('open'); box.innerHTML='';
    hitsEl.style.display='none'; return;
  }
  const q = document.getElementById('search-input').value;
  box.innerHTML = hits.slice(0,8).map((h, i) => {
    const u = h.u;
    const meta = [u.mw + ' MW' + (u.t==='pv'?'p':''), u.g].filter(Boolean).join(' · ');
    return `<div class="sug-item ${i===0?'active':''}" data-i="${i}">
      <span>${highlightName(u.n, q)}</span>
      <span class="sug-meta">${esc(meta)}</span></div>`;
  }).join('');
  box.classList.add('open');
  // Klick auf Vorschlag
  box.querySelectorAll('.sug-item').forEach(el => {
    el.onclick = () => selectSuggestion(parseInt(el.dataset.i));
  });
  // Trefferzahl anzeigen
  hitsEl.style.display='block';
  resultEl.textContent = hits.length > 8 ? hits.length + ' Treffer (zeige 8)' : hits.length + ' Treffer';
}

function closeSuggest() {
  document.getElementById('search-suggest').classList.remove('open');
  document.getElementById('topbar-hits').style.display='none';
}

let _activeSuggest = -1;
function selectSuggestion(i) {
  const box = document.getElementById('search-suggest');
  const items = box.querySelectorAll('.sug-item');
  const q = document.getElementById('search-input').value;
  const hits = searchUnits(q);
  if (!hits.length || items.length === 0) return;
  const target = hits[i];
  flyToUnit(target.u, target.u.n);
  document.getElementById('search-input').value = target.u.n;
  closeSuggest();
}

function onSearchInput() {
  const q = document.getElementById('search-input').value;
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  if (norm(q).length < 2) { closeSuggest(); return; }
  const hits = searchUnits(q);
  _activeSuggest = 0;
  showSuggest(hits);
}

function onSearchKeydown(e) {
  const q = document.getElementById('search-input').value;
  const box = document.getElementById('search-suggest');
  const items = box.querySelectorAll('.sug-item');
  if (!box.classList.contains('open')) {
    if (e.key === 'Enter' && norm(q).length >= 2) {
      const hits = searchUnits(q);
      if (hits.length) { flyToUnit(hits[0].u, hits[0].u.n); }
    }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const next = e.key === 'ArrowDown' ? Math.min(_activeSuggest+1, items.length-1) : Math.max(_activeSuggest-1, 0);
    _activeSuggest = next;
    items.forEach((el,i) => el.classList.toggle('active', i===next));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    selectSuggestion(_activeSuggest);
  } else if (e.key === 'Escape') {
    closeSuggest();
  }
}

function flyToUnit(u, label) {
  // auf Treffer zoomen, Vorschläge ausschalten, nur diese(n) Marker zeigen
  const single = allUnits.filter(x => x.m === u.m);
  renderMarkers(single);
  map.setView([u.lat, u.lon], 11);
  // Popup öffnen
  setTimeout(() => {
    // Marker in Cluster-Gruppe suchen
    const m = clusterGroup.getLayers().find(l => l._latlng && l._latlng.lat === u.lat && l._latlng.lng === u.lon);
    if (m) m.openPopup();
  }, 300);
}

function buildPopup(u) {
  let html = `<h3>${esc(u.n)}</h3><table>`;
  const add = (label, val) => { if (val != null && val !== '') html += `<tr><td>${label}</td><td>${esc(val)}</td></tr>`; };
  add('MaStR-Nr.', u.m);
  add('Typ', u.t === 'wind' ? 'Wind' : 'Photovoltaik');
  add('Art', u.art);
  add('Leistung', u.mw + ' MW' + (u.t==='pv'?'p':''));
  add('Bundesland', u.b);
  add('Landkreis', u.lk);
  add('Gemeinde', u.g);
  add('PLZ', u.plz);
  add('Inbetriebnahme', u.inb);
  add('Status', u.st);
  add('Netzbetreiber', u.nb);
  add('Betreiber', u.ab);
  // PV-spezifisch
  if (u.t === 'pv') {
    add('Solar-Module', u.mod?.toLocaleString());
    add('Ausrichtung', u.ausr);
    add('Solarpark', u.park);
  } else {
    add('Nabenhöhe', u.nh ? u.nh + ' m' : null);
    add('Rotordurchmesser', u.rd ? u.rd + ' m' : null);
    add('Lichte Höhe', u.lhh ? u.lhh + ' m' : null);
    add('Typ', u.typ);
    add('Hersteller', u.herst);
    add('Windpark', u.wp);
    add('Lage', u.los);
  }
  html += '</table>';
  return html;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===================== Statistik-Panel ===================== */
let _stats = null;          // rohe Statistiken aus statistiken.json
let _statsState = {         // UI-Zustand
  tab: 'betreiber',
  tech: '',                 // '' | 'wind' | 'pv'
  top: '50',
  filter: '',
  sortKey: 'sum_mw',
  sortDir: 'desc',
  groesseTech: 'wind',
  groesseMeasure: 'anzahl'  // 'anzahl' | 'leistung'
};

function initStats() {
  _stats = window.__STATS__;
  // Buttons
  document.getElementById('btn-stats').addEventListener('click', openStats);
  document.getElementById('stats-close').addEventListener('click', closeStats);
  document.getElementById('stats-overlay').addEventListener('click', closeStats);
  // Tabs
  document.querySelectorAll('#stats-tabs .tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#stats-tabs .tab').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.stats-tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + btn.dataset.tab));
      _statsState.tab = btn.dataset.tab;
    });
  });
  // Betreiber-Controls
  document.getElementById('stats-tech').addEventListener('change', e => { _statsState.tech = e.target.value; renderBetreiber(); });
  document.getElementById('stats-top').addEventListener('change', e => { _statsState.top = e.target.value; renderBetreiber(); });
  document.getElementById('stats-filter').addEventListener('input', e => { _statsState.filter = e.target.value; renderBetreiber(); });
  // Sortierung (Th-Klick)
  document.querySelectorAll('#stats-table th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (_statsState.sortKey === key) {
        _statsState.sortDir = _statsState.sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        _statsState.sortKey = key;
        _statsState.sortDir = 'desc';
      }
      renderBetreiber();
    });
  });
  // Größenklassen
  document.querySelectorAll('#groesse-toggle .gbtn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#groesse-toggle .gbtn').forEach(x => x.classList.toggle('active', x === b));
      _statsState.groesseTech = b.dataset.tech;
      renderGroesse();
    });
  });
  document.querySelectorAll('#groesse-measure .mbtn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#groesse-measure .mbtn').forEach(x => x.classList.toggle('active', x === b));
      _statsState.groesseMeasure = b.dataset.measure;
      renderGroesse();
    });
  });
  document.addEventListener('mousemove', moveBarTip);
}

function openStats() {
  document.getElementById('stats-panel').classList.add('open');
  document.getElementById('stats-overlay').classList.add('open');
  renderBetreiber();
  renderGroesse();
}
function closeStats() {
  document.getElementById('stats-panel').classList.remove('open');
  document.getElementById('stats-overlay').classList.remove('open');
}

// ----- Betreiber-Tabelle -----
function renderBetreiber() {
  const tbody = document.getElementById('stats-tbody');
  if (!_stats || !_stats.betreiber) {
    tbody.innerHTML = '<tr><td colspan="4">Keine Statistik-Daten</td></tr>';
    return;
  }
  let rows = [..._stats.betreiber];
  // Technologie-Filter
  if (_statsState.tech) {
    rows = rows.filter(b => b.tech[_statsState.tech] > 0);
  }
  // Textfilter (accent-/case-unabhängig)
  const nf = norm(_statsState.filter);
  if (nf) {
    rows = rows.filter(b => norm(b.name).includes(nf));
  }
  // Sortierung
  const key = _statsState.sortKey;
  rows.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (key === 'name') va = (va||'').toLowerCase(), vb = (vb||'').toLowerCase();
    if (typeof va === 'string') return _statsState.sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    va = va ?? 0; vb = vb ?? 0;
    return _statsState.sortDir === 'asc' ? va - vb : vb - va;
  });
  // Top-N
  const total = rows.length;
  if (_statsState.top !== 'all') {
    rows = rows.slice(0, parseInt(_statsState.top, 10));
  }
  // Render
  tbody.innerHTML = rows.map(b => {
    const techBadge = (b.tech.wind && b.tech.pv) ? ' ⚡🟠' : (b.tech.wind ? ' ⚡' : ' 🟠');
    return `<tr data-betreiber="${esc(b.name)}">
      <td class="name" title="${esc(b.name)}">${esc(b.name.split(')')[0].split('(')[0].trim())}${techBadge}</td>
      <td class="num">${b.anzahl}</td>
      <td class="num">${b.sum_mw.toLocaleString('de-DE', {maximumFractionDigits:0})}</td>
      <td class="num">${b.avg_mw.toLocaleString('de-DE', {maximumFractionDigits:1})}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4">Keine Treffer</td></tr>';
  // Klick auf Zeile -> Karte filtert Betreiber
  tbody.querySelectorAll('tr[data-betreiber]').forEach(tr => {
    tr.addEventListener('click', () => selectBetreiber(tr.dataset.betreiber));
  });
  // Sortier-Indikatoren
  document.querySelectorAll('#stats-table th').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.key === _statsState.sortKey) th.classList.add(_statsState.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
  });
  document.getElementById('stats-count').textContent =
    `${rows.length} angezeigt von ${total} Betreibern`;
}

// Betreiber auf der Karte filtern (B7)
function selectBetreiber(name) {
  const matching = allUnits.filter(u => u.ab === name);
  if (!matching.length) return;
  renderMarkers(matching);
  if (matching.length === 1) {
    map.setView([matching[0].lat, matching[0].lon], 11);
  } else {
    map.fitBounds(matching.map(u => [u.lat, u.lon]), { padding: [30, 30] });
  }
  document.getElementById('search-input').value = matching.length > 1
    ? `Betreiber: ${name} (${matching.length} Anlagen)`
    : name;
  document.getElementById('search-clear').style.display = 'block';
  closeStats();
}

// ----- Größenklassen-Balken (professionell mit Achsen) -----
function renderGroesse() {
  const chart = document.getElementById('groesse-chart');
  if (!_stats || !_stats.groessenklassen) { chart.innerHTML = '<p>Keine Daten</p>'; return; }
  const tech = _statsState.groesseTech;
  const isWind = tech === 'wind';
  const klassen = _stats.groessenklassen[tech];
  if (!klassen || !klassen.length) { chart.innerHTML = '<p>Keine Daten</p>'; return; }

  const measure = _statsState.groesseMeasure; // 'anzahl' | 'leistung'
  const maxVal = Math.max(...klassen.map(k => measure === 'anzahl' ? k.anzahl : k.sum_mw));
  const gesTotal = _stats.gesamt;

  // Summary-Box
  const sumAnzahl = klassen.reduce((s, k) => s + k.anzahl, 0);
  const sumMW = klassen.reduce((s, k) => s + k.sum_mw, 0);
  document.getElementById('groesse-summary').innerHTML =
    `<span><b>${isWind ? 'Wind' : 'Photovoltaik'}</b></span>` +
    `<span>Anlagen: <b>${sumAnzahl.toLocaleString('de-DE')}</b></span>` +
    `<span>Gesamtleistung: <b>${sumMW.toLocaleString('de-DE', {maximumFractionDigits:0})} MW</b></span>` +
    `<span>Max Einzelanlage: <b>${(isWind ? gesTotal.wind_max_mw : gesTotal.pv_max_mw).toLocaleString('de-DE', {maximumFractionDigits:0})} MW</b></span>`;
  document.getElementById('groesse-legend').innerHTML =
    `<span>Balken = ${measure === 'anzahl' ? 'Anzahl der Anlagen' : 'installierte Leistung'} je Größenklasse · Hover für Details</span>`;

  // Achsen-Skala: 0 / 50 / 100 %
  const yTicks = [
    { pos: 0, val: maxVal },
    { pos: 50, val: Math.round(maxVal / 2) },
    { pos: 100, val: 0 }
  ];

  // Klassische vertikale Balken: jeder Balken hat Titel über + Wert im Balken.
  // Layout: horizontal als Balkenreihen übereinander (horizontaler Balkenschart)
  // mit y-Skala links und Klassen-Label unter dem Balken.
  let body = `<div class="chart-wrap">
    <div class="chart-y">
      ${yTicks.map(t => `<div class="y-ticks t${t.pos}">${fmtY(t.val)}</div>`).join('')}
    </div>
    <div class="chart-grid">`;

  body += klassen.map(k => {
    const rawVal = measure === 'anzahl' ? k.anzahl : k.sum_mw;
    const pct = Math.max(4, Math.round(100 * rawVal / maxVal));
    const color = isWind ? 'wind' : 'pv';
    const countLabel = measure === 'anzahl'
      ? k.anzahl.toLocaleString('de-DE')
      : k.sum_mw.toLocaleString('de-DE', {maximumFractionDigits:0}) + ' MW';
    const amountLabel = measure === 'anzahl'
      ? k.sum_mw.toLocaleString('de-DE', {maximumFractionDigits:0}) + ' MW'
      : k.anzahl.toLocaleString('de-DE') + ' Anlagen';
    return `<div class="bar-cell">
      <div class="bar-row" data-tip='${JSON.stringify({
        klasse: k.label + ' MW', anzahl: k.anzahl, sum: k.sum_mw,
        anteil_anzahl: k.anteil_anzahl, anteil_summe: k.anteil_summe,
        units: measure
      })}'>
        <div class="bar-track">
          <span class="bar-fill ${color}" style="width:${widthByPct(pct)}"></span>
        </div>
        <span class="bar-value">${countLabel}</span>
      </div>
      <div class="bar-label"><span class="bar-klasse">${esc(k.label)}</span><small> MW</small><span class="bar-sublabel">${measure==='anzahl' ? 'Summe: ' + amountLabel : 'Anlagen: ' + amountLabel}</span></div>
    </div>`;
  }).join('');

  body += `</div></div>`;
  chart.innerHTML = body;

  // Klick auf Zeile -> nichts (nur Tooltip)
  chart.querySelectorAll('.bar-row').forEach(row => {
    row.addEventListener('mouseenter', e => showBarTip(e, row.dataset.tip));
    row.addEventListener('mousemove', moveBarTip);
    row.addEventListener('mouseleave', hideBarTip);
  });
}

function widthByPct(pct) {
  // für sehr schmale Balken den Label außerhalb positionieren; pct als Zahl
  return Math.max(4, pct) + '%';
}

function fmtY(v) {
  if (v >= 1000000) return (v / 1e6).toLocaleString('de-DE', {maximumFractionDigits:1}) + ' M';
  if (v >= 1000) return (v / 1e3).toLocaleString('de-DE', {maximumFractionDigits:1}) + 'k';
  return v.toLocaleString('de-DE');
}

function showBarTip(e, data) {
  const tip = document.getElementById('bar-tip');
  let d;
  try { d = JSON.parse(data); } catch { d = {}; }
  const isAnzahl = d.units === 'anzahl';
  const countFmt = Number(d.anzahl).toLocaleString('de-DE');
  const sumFmt = Number(d.sum).toLocaleString('de-DE', {maximumFractionDigits:0}) + ' MW';
  tip.innerHTML = `
    <b>Klasse ${esc(d.klasse)}</b>
    <div class="tip-row"><span>Anlagen</span><span>${countFmt}</span></div>
    <div class="tip-row"><span>Leistung</span><span>${sumFmt}</span></div>
    <div class="tip-row"><span>Anteil Anlagen</span><span>${d.anteil_anzahl}%</span></div>
    <div class="tip-row"><span>Anteil Leistung</span><span>${d.anteil_summe}%</span></div>
    ${isAnzahl ? '<div class="tip-note">Balkenhöhe = Anlagen</div>' : '<div class="tip-note">Balkenhöhe = installierte Leistung</div>'}`;
  tip.style.display = 'block';
  moveBarTip(e);
}
function moveBarTip(e) {
  const tip = document.getElementById('bar-tip');
  if (!tip || tip.style.display === 'none') return;
  // am rechten Rand umklappen, damit Tooltip nicht aus dem Viewport fällt
  const pad = 12;
  let left = e.clientX + pad;
  if (left + tip.offsetWidth + pad > window.innerWidth) left = e.clientX - tip.offsetWidth - pad;
  let top = e.clientY + pad;
  if (top + tip.offsetHeight + pad > window.innerHeight) top = e.clientY - tip.offsetHeight - pad;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideBarTip() { document.getElementById('bar-tip').style.display = 'none'; }

init();
</script>
